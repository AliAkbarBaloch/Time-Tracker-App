<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 620" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>TimeTracker Architecture</title>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #24292f; stroke-width: 1.4; }
    .header { fill: #eef2ff; stroke: #3730a3; stroke-width: 1.4; }
    .tag { fill: #ffffff; stroke: #6b7280; stroke-width: 1; stroke-dasharray: 3 2; }
    .title { fill: #111827; font-weight: 600; }
    .subtitle { fill: #4b5563; }
    .tagtext { fill: #4b5563; }
    .edgelabel { fill: #374151; }
    .arrow { stroke: #6b7280; stroke-width: 1.5; fill: none; }
    .arrowfill { fill: #6b7280; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #8b949e; }
      .header { fill: #1c2333; stroke: #7aa2f7; }
      .tag { fill: #161b22; stroke: #8b949e; }
      .title { fill: #e6edf3; }
      .subtitle { fill: #c9d1d9; }
      .tagtext { fill: #c9d1d9; }
      .edgelabel { fill: #c9d1d9; }
      .arrow { stroke: #8b949e; }
      .arrowfill { fill: #8b949e; }
    }
  </style>

  <rect class="bg" x="0" y="0" width="820" height="620"/>

  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" class="arrowfill"/>
    </marker>
  </defs>

  <!-- Browser -->
  <rect class="box" x="290" y="20" width="240" height="50" rx="6"/>
  <text class="title" x="410" y="50" text-anchor="middle" font-size="14">Browser</text>

  <line class="arrow" x1="410" y1="70" x2="410" y2="106" marker-end="url(#arrowhead)"/>

  <!-- Frontend -->
  <rect class="box" x="190" y="110" width="440" height="75" rx="6"/>
  <text class="title" x="410" y="140" text-anchor="middle" font-size="14">React Frontend</text>
  <text class="subtitle" x="410" y="162" text-anchor="middle" font-size="11">Vite · React Router · Axios · Context (Auth / Timer / Theme)</text>

  <line class="arrow" x1="410" y1="185" x2="410" y2="221" marker-end="url(#arrowhead)"/>
  <text class="edgelabel" x="425" y="207" font-size="10">REST / JSON</text>
  <text class="edgelabel" x="425" y="219" font-size="10">JWT bearer (or ?token= for SSE)</text>

  <!-- Backend container -->
  <rect class="box" x="60" y="225" width="700" height="302" rx="8"/>
  <rect class="header" x="60" y="225" width="700" height="34" rx="8"/>
  <text class="title" x="410" y="247" text-anchor="middle" font-size="14">Spring Boot Backend</text>

  <!-- Security -->
  <rect class="box" x="130" y="279" width="560" height="42" rx="5"/>
  <text class="title" x="410" y="296" text-anchor="middle" font-size="12">Security Filter Chain</text>
  <text class="subtitle" x="410" y="312" text-anchor="middle" font-size="10">LoginRateLimitFilter → JwtAuthFilter → SecurityContext</text>

  <line class="arrow" x1="410" y1="321" x2="410" y2="337" marker-end="url(#arrowhead)"/>

  <!-- Controllers -->
  <rect class="box" x="130" y="341" width="560" height="42" rx="5"/>
  <text class="title" x="410" y="358" text-anchor="middle" font-size="12">Controllers</text>
  <text class="subtitle" x="410" y="374" text-anchor="middle" font-size="10">REST API boundary — auth, tasks, timer, projects, templates, analytics, dashboard, users</text>
  <rect class="tag" x="555" y="331" width="150" height="20" rx="10"/>
  <text class="tagtext" x="630" y="345" text-anchor="middle" font-size="9">DTO validation</text>

  <line class="arrow" x1="410" y1="383" x2="410" y2="399" marker-end="url(#arrowhead)"/>

  <!-- Services -->
  <rect class="box" x="130" y="403" width="560" height="42" rx="5"/>
  <text class="title" x="410" y="420" text-anchor="middle" font-size="12">Services</text>
  <text class="subtitle" x="410" y="436" text-anchor="middle" font-size="10">Business rules, authorization, analytics aggregation</text>
  <rect class="tag" x="555" y="393" width="150" height="20" rx="10"/>
  <text class="tagtext" x="630" y="407" text-anchor="middle" font-size="9">Exception handling</text>

  <line class="arrow" x1="410" y1="445" x2="410" y2="481" marker-end="url(#arrowhead)"/>

  <!-- Repositories -->
  <rect class="box" x="130" y="485" width="560" height="42" rx="5"/>
  <text class="title" x="410" y="502" text-anchor="middle" font-size="12">Repositories</text>
  <text class="subtitle" x="410" y="518" text-anchor="middle" font-size="10">Spring Data JPA</text>

  <line class="arrow" x1="410" y1="527" x2="410" y2="563" marker-end="url(#arrowhead)"/>

  <!-- H2 -->
  <rect class="box" x="290" y="567" width="240" height="45" rx="6"/>
  <text class="title" x="410" y="587" text-anchor="middle" font-size="12">H2 Database</text>
  <text class="subtitle" x="410" y="602" text-anchor="middle" font-size="10">file-based (dev) / in-memory (tests)</text>
</svg>
