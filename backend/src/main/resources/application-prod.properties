# PostgreSQL — production profile
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/timetracker}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:timetracker}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:timetracker}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Disable H2 console in production
spring.h2.console.enabled=false
