spring.application.name=time-tracker

# H2 file-based persistence (survives restarts)
spring.datasource.url=jdbc:h2:file:./data/timetracker
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 console — disabled by default; override with -Dspring.h2.console.enabled=true for local DB inspection
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# Server port
server.port=8080

# JWT
app.jwt.secret=${JWT_SECRET:TimeTrackerSuperSecretKeyForJWTSigningMustBe256BitsLongAtLeast32Chars!}
app.jwt.expiration-ms=86400000
