services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: timetracker
      POSTGRES_USER: ${POSTGRES_USER:-timetracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-timetracker}
    volumes:
      - timetracker-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-timetracker}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/timetracker
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-timetracker}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-timetracker}
    depends_on:
      db:
        condition: service_healthy

volumes:
  timetracker-pg:
